<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto com iframes com Iframe</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        html, body{
            height: 100vh;
            width: 100vw;
        }
        body{
            background-image: url('imagens/fundo-madeira.jpg');
            background-position: top center;
            height: 100vh;
            width: 100vw;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        main#container{
            position: relative;
            height: 100vh;
        }
        section#telefone{
            position: absolute;
            
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);

            height: 627px;
            width: 311px;
            background: url('imagens/frame-iphone.png'); /* tava dando aquela merda dos botoes irem la pra baixo pq o frame iphone tava como img e tava ocupando epaço, dessa forma esta por tras*/
        }
        div#contframe{
            position: relative;
            width: 100%;
            height: 100%;

        }
        iframe#frame{
            
            height: 467px;
            width: 265px;
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%,-50%);
        }
        section#redes {
          /*width: 50px; com width nao da certo pois ele altera o display da section , entao pra deixar em coluna tem que usar o br msm*/
            text-align: right;
            
        }
        section#redes img{
            width: 50px;
            margin: 10px;
            border-radius: 50%;

        }
        
        
    </style>
</head>
<body >
    <main id="container">
        
        <section id="telefone">
            <div id="contframe"><iframe name="frame" scrolling="auto" id="frame" class="tela" src="home.html" frameborder="0"></iframe></div>
        </section>
        <section id="redes">
            <a href="#" target="frame"><img src="imagens/logo-home.jpg" alt=""></a><br>
            <a href="#" target="frame"><img src="imagens/logo-youtube.jpg" alt=""></a><br>
            <a href="github.html" target="frame"><img src="imagens/logo-github.jpg" alt=""></a><br>
            <a href="#" target="frame"><img src="imagens/logo-instagram.jpg" alt=""></a><br>
            <a href="#" target="frame"><img src="imagens/logo-twitter.jpg" alt=""></a><br>
            <a href="#" target="frame"><img src="imagens/logo-facebook.jpg" alt=""></a>
        
        </section>
    </main>
</body>
</html>
