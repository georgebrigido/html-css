<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms</h1>
    <form action="cadastro.php">
        <p>
            <label for="in1">Numero 1</label>
            <input type="number" name="n1" id="in1" min="0" max="50" oninput="isoma.inneHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="in2">Numero 2</label>
            <input type="number" name="n2" id="in2" min="0" max="50" oninput="isoma.inneHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
            <label for="isoma">Soma:</label>
            <output id="isoma">0</output>
        </p>
    </form>

    <form action="cadastro.php">
        <p>
            <label for="inum">Label</label>
            <input type="range" name="numb" id="inum" min="0" max="10" value="5" oninput="ival.inneHTML = Number(inum.value)">
            <output id="ival">5</output>
        </p>
    </form>
</body>
</html>
