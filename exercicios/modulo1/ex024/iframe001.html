<head>

    <title>Estudos do iFrame</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 4px dashed yellow;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <!--Tamanho padrao 300x150 -->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500" scrolling="no">
            [Seu navegador nao é compativel com iframe]
        </iframe>

       para aprender a programar</p>
     <iframe src="https://www.google.com.br/" frameborder="0">[Seu navegador nao é compativel com iframe]</iframe>

     <!--Alguns sites são protegidos para nao serem exibidos em iframe-->
     <p>
        O site do guanabara tbm eh muito legal
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="500" width="500"></iframe>
     </p>
