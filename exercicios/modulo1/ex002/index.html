<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever
        um paragrafo de qualquer
        jeito. Dentro da tag &lt;p&gt;.
    </p>
    Se precisar queberar o texto em algum lugar especifico, como esse,<br> você pode usar a tag br.
    <hr>
    <p>Vamos Adicionar alguns símbolos especiais
    &reg;
    &copy;
    </p>
    <p>Vamos adicionar alguns emoji:
        &#x2b50; <!--O #x significa hexadecimal-->
        &#x2b50;
    </p>
</body>
</html>
