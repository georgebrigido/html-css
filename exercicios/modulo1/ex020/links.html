<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgba(83, 39, 18, 0.644);
        }
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active {
            color: rgb(255, 0, 0);
        }
        a::after{ /* Indicações, pseudoelementos. Não fazem parte da semantica é apenas um visual, que nesse caso fica depois do link*/
            content: '[Link]';
            color: darkgrey;
            text-decoration: none;
            font-weight: normal;
        }
        .especial::before {
            content: '★';
            color: rgb(173, 132, 19);
        }

        /*
        #  = id
        .  = class
        :  = pseudo-class
        :: = pseudo-element
        >  = children
        */
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul >
        <li><a href="">Repositorio Github</a></li>
        <li><a href="" class="especial">Canal do Youtube</a></li>
        <li><a href="">Site do CursoemVideo</a></li>
    </ul>
</body>
</html>
